<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRAVEEN AI VIDEO STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#121a30;border-bottom:1px solid #273450}
h1{color:#70e1ff;font-size:25px}
main{max-width:900px;margin:auto;padding:15px}
.card{background:#151e33;border:1px solid #293956;padding:22px;border-radius:16px;margin-bottom:20px}
label{display:block;margin:16px 0 8px;font-weight:bold}
textarea,select,input{width:100%;padding:13px;border-radius:9px;border:1px solid #394b68;background:#0c1426;color:white;font-size:15px}
textarea{min-height:130px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;margin-top:18px;background:linear-gradient(90deg,#00c6ff,#7b61ff);color:white}
.secondary{background:#293956;color:white;margin:6px 4px 0 0}
#status{margin-top:15px;line-height:1.7;overflow-wrap:anywhere}
.note{color:#bdc9dc;font-size:13px;line-height:1.6}
video{width:100%;max-height:450px;background:black}
@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>🎬 PRAVEEN AI VIDEO STUDIO</h1>
<p>हिंदी टेक्स्ट से AI वीडियो बनाने का स्टूडियो</p>
</header>

<main>
<section class="card">
<h2>✨ अपना वीडियो बनाओ</h2>
<label for="prompt">वीडियो का Prompt लिखो</label>
<textarea id="prompt" placeholder="उदाहरण: भगवान शिव की रहस्यमयी 3D कहानी, हिंदी आवाज और सिनेमैटिक दृश्य।"></textarea>

<div class="row">
<div>
<label for="duration">वीडियो अवधि</label>
<select id="duration">
<option value="15">15 सेकंड</option>
<option value="30" selected>30 सेकंड</option>
<option value="60">1 मिनट</option>
<option value="180">3 मिनट</option>
<option value="600">10 मिनट</option>
</select>
</div>
<div>
<label for="ratio">वीडियो आकार</label>
<select id="ratio">
<option value="9:16">YouTube Shorts (9:16)</option>
<option value="16:9">YouTube (16:9)</option>
<option value="1:1">Square (1:1)</option>
</select>
</div>
<div>
<label for="style">वीडियो स्टाइल</label>
<select id="style">
<option>3D Animation</option>
<option>Cinematic Realistic</option>
<option>Cartoon Animation</option>
<option>Mythology</option>
<option>Educational</option>
<option>Nature</option>
<option>Anime</option>
</select>
</div>
<div>
<label for="quality">क्वालिटी</label>
<select id="quality">
<option value="720">720p HD</option>
<option value="1080" selected>1080p Full HD</option>
<option value="2160">4K</option>
</select>
</div>
</div>

<label for="voice">आवाज</label>
<select id="voice">
<option value="hi-IN">हिंदी</option>
<option value="en-US">English</option>
<option value="none">बिना आवाज</option>
</select>

<button class="primary" id="generate">🚀 Backend से कनेक्ट करो</button>
<div id="status" role="status" aria-live="polite"></div>
<div id="result"></div>
<p class="note">अभी यह ऐप Backend कनेक्शन टेस्ट करता है। वास्तविक वीडियो बनाने के लिए AI वीडियो मॉडल/API कनेक्ट करना बाकी है।</p>
</section>

<section class="card">
<h3>🎙️ हिंदी वॉइस टेस्ट</h3>
<button class="secondary" id="speak">🔊 टेक्स्ट सुनो</button>
<button class="secondary" id="stop">⏹️ आवाज बंद करो</button>
</section>

<section class="card">
<h3>📁 अपनी वीडियो फाइल चलाओ</h3>
<input id="videoFile" type="file" accept="video/*">
<div id="preview"></div>
</section>
</main>

<script>
const API = "https://lingering-frost-0186.praveenverma4580.workers.dev";

document.getElementById("generate").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const prompt = document.getElementById("prompt").value.trim();

  result.replaceChildren();

  if (!prompt) {
    status.textContent = "पहले वीडियो का Prompt लिखो।";
    return;
  }

  const payload = {
    prompt,
    duration: document.getElementById("duration").value,
    ratio: document.getElementById("ratio").value,
    style: document.getElementById("style").value,
    quality: document.getElementById("quality").value,
    voice: document.getElementById("voice").value
  };

  status.textContent = "⏳ Backend से कनेक्ट हो रहे हैं...";
  document.getElementById("generate").disabled = true;

  try {
    const response = await fetch(API + "/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Backend में समस्या आई।");
    }

    if (data.status === "ready_for_provider_setup") {
      status.textContent =
        "✅ Backend कनेक्ट हो गया और Prompt पहुँच गया। " +
        "लेकिन असली AI वीडियो मॉडल अभी कनेक्ट नहीं है, इसलिए वीडियो अभी नहीं बना।";
    } else {
      status.textContent = data.message || "Backend से जवाब मिला।";
    }

    const project = document.createElement("pre");
    project.style.cssText =
      "white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1426;padding:12px;border-radius:8px";
    project.textContent = JSON.stringify(payload, null, 2);
    result.appendChild(project);

    const blob = new Blob([JSON.stringify(payload, null, 2)], {
      type: "application/json"
    });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "praveen-video-project.json";
    link.textContent = "📥 प्रोजेक्ट सेटिंग डाउनलोड करो";
    link.style.cssText = "display:inline-block;margin-top:12px;color:#70e1ff";
    result.appendChild(link);
  } catch (error) {
    status.textContent =
      "❌ Backend कनेक्शन में समस्या: " + error.message +
      " — इंटरनेट और Worker URL चेक करो।";
  } finally {
    document.getElementById("generate").disabled = false;
  }
});

document.getElementById("speak").addEventListener("click", () => {
  const text = document.getElementById("prompt").value.trim();
  const status = document.getElementById("status");

  if (!text) {
    status.textContent = "पहले Prompt लिखो।";
    return;
  }
  if (!("speechSynthesis" in window)) {
    status.textContent = "इस ब्राउज़र में वॉइस टेस्ट उपलब्ध नहीं है।";
    return;
  }

  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = document.getElementById("voice").value === "en-US"
    ? "en-US" : "hi-IN";
  speechSynthesis.speak(utterance);
});

document.getElementById("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
});

document.getElementById("videoFile").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  const preview = document.getElementById("preview");
  preview.replaceChildren();

  const video = document.createElement("video");
  video.controls = true;
  video.src = url;
  video.style.marginTop = "12px";
  preview.appendChild(video);
});
</script>
</body>
</html>
